name: Keep-Alive Pinger

on:
  schedule:
    - cron: '*/14 * * * *'
    - cron: '0 0 * * 3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Server
        run: |
          curl -fsS https://api.joblogs.sufiyanmogal.me/api/server-health > /dev/null
          echo "Render server pinged"

      - name: Ping Supabase Database
        run: |
          curl -fsS https://api.joblogs.sufiyanmogal.me/api/db-health > /dev/null
          echo "Supabase DB pinged"